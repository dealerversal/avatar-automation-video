name: Deploy Avatar Automation Video to Dual VPS

on:
  push:
    branches:
      - main_new
  workflow_dispatch:

concurrency:
  group: deploy-avatar-automation-video
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to ${{ matrix.server.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - name: dvnew
            host: 2.24.75.236
            process_name: video-gen.dealerversal.com
            public_url: https://video-gen.dealerversal.com
          - name: dealerversal
            host: 72.60.118.141
            process_name: video-gen-2.dealerversal.com
            public_url: https://video-gen-2.dealerversal.com
    env:
      HOST: ${{ matrix.server.host }}
      USER: root
      PROJECT_PATH: /root/projects/avatar-automation-video
      PROCESS_NAME: ${{ matrix.server.process_name }}
      PUBLIC_SERVICE_URL: ${{ matrix.server.public_url }}

    steps:
      - name: Set up SSH keys
        uses: webfactory/ssh-agent@v0.5.0
        with:
          ssh-private-key: ${{ secrets.SERVER_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v2

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          # Customize server-specific environment variables for this target node
          sed -i '/^PM2_APP_NAME=/d' .env || true
          sed -i '/^PUBLIC_SERVICE_URL=/d' .env || true
          echo "PM2_APP_NAME=${{ matrix.server.process_name }}" >> .env
          echo "PUBLIC_SERVICE_URL=${{ matrix.server.public_url }}" >> .env
          echo "Verified .env file contents (keys only for security):"
          grep -v '^#' .env | grep '=' | cut -d= -f1

      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          
          # Setup SSH ControlMaster for multiplexing (reuses a single TCP connection)
          echo "Establishing SSH Master connection to ${{ matrix.server.name }} (${{ env.HOST }})..."
          ssh -M -S ~/.ssh/control_socket -fnN -o StrictHostKeyChecking=no ${{ env.USER }}@${{ env.HOST }}
          
          # Setup exit trap to close the multiplexed socket when the job completes
          trap 'echo "Closing SSH Master connection..."; ssh -S ~/.ssh/control_socket -O exit ${{ env.USER }}@${{ env.HOST }} 2>/dev/null || true' EXIT

          echo "Creating project directory..."
          ssh -S ~/.ssh/control_socket ${{ env.USER }}@${{ env.HOST }} "mkdir -p ${{ env.PROJECT_PATH }}"

          echo "Syncing files using rsync..."
          rsync -ah --no-o --no-g --no-perms --omit-dir-times \
          -e "ssh -S ~/.ssh/control_socket" \
          --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='browser-profile' --exclude='logs' \
          ./ ${{ env.USER }}@${{ env.HOST }}:${{ env.PROJECT_PATH }}

          echo "Running remote deployment commands on ${{ matrix.server.name }}..."
          ssh -S ~/.ssh/control_socket ${{ env.USER }}@${{ env.HOST }} "
            set -e
            # Install Node.js if not already installed
            if ! command -v node &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
              apt-get install -y nodejs
            fi

            # Install PM2 globally if not already installed
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            cd ${{ env.PROJECT_PATH }}
            npm install --production

            # Install Playwright browser dependencies if needed
            npx playwright install chromium --with-deps || true

            # Restart the application using ecosystem config with server-specific process name
            if pm2 show ${{ env.PROCESS_NAME }} > /dev/null 2>&1; then
              pm2 delete ${{ env.PROCESS_NAME }}
            fi
            PM2_APP_NAME=${{ env.PROCESS_NAME }} PUBLIC_SERVICE_URL=${{ env.PUBLIC_SERVICE_URL }} pm2 start ecosystem.config.cjs --env production

            # Propagate codebase updates to all cloned avatar instance workspaces on this VPS
            node scripts/sync-all-instances.js || true

            pm2 save
          "
