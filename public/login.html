<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google FX Flow — VPS Session Setup</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex items-center justify-center p-3 sm:p-6 selection:bg-slate-200">

    <div class="w-full max-w-lg bg-white border border-slate-200 rounded-2xl p-5 sm:p-7">
        
        <!-- Main Header -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-slate-100 gap-3">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-slate-900 flex items-center justify-center text-white shrink-0">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-900 tracking-tight leading-tight">Google FX Session Manager</h1>
                    <p class="text-xs text-slate-500 font-medium">VPS Browser Profile Sync</p>
                </div>
            </div>

            <!-- Status Badge -->
            <div id="statusBadge" class="hidden self-start sm:self-center inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold border transition-all shrink-0">
                <span id="statusDot" class="w-2 h-2 rounded-full"></span>
                <span id="statusText">...</span>
            </div>
        </div>

        <!-- Skeleton Loader -->
        <div id="skeletonLoader" class="mt-5 space-y-3 animate-pulse">
            <div class="h-4 bg-slate-200 rounded w-1/3"></div>
            <div class="h-20 bg-slate-100 border border-slate-200/60 rounded-xl p-4"></div>
            <div class="h-10 bg-slate-200 rounded-xl w-full"></div>
        </div>

        <!-- SECTION A: Connected Profile State -->
        <div id="connectedState" class="hidden mt-5 space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-emerald-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span>Connected Profile</span>
                </h2>
            </div>

            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4">
                <div class="flex items-center gap-3.5">
                    <div id="userAvatarContainer" class="w-11 h-11 rounded-full bg-emerald-100 border border-emerald-200 text-emerald-800 flex items-center justify-center shrink-0 overflow-hidden font-bold text-base">
                        <span id="userInitial">✓</span>
                        <img id="userAvatarImg" class="hidden w-full h-full object-cover" src="" alt="Avatar">
                    </div>
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-2">
                            <h3 class="text-sm font-bold text-slate-900 truncate" id="userName">Google Account Connected</h3>
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 shrink-0">Active</span>
                        </div>
                        <p class="text-xs text-slate-600 font-medium mt-0.5 truncate" id="userEmail"></p>
                        <p class="text-xs text-slate-400 mt-0.5" id="connectedDetails">Google FX Flow session active.</p>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                <button onclick="toggleForm()" class="py-2.5 px-3 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-xs rounded-xl border border-slate-300 transition-colors flex items-center justify-center gap-2">
                    <svg class="w-4 h-4 text-slate-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                    </svg>
                    <span>Upload Profile</span>
                </button>
                <button onclick="checkStatus()" class="py-2.5 px-3 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-xs rounded-xl border border-slate-300 transition-colors flex items-center justify-center gap-2">
                    <svg class="w-4 h-4 text-slate-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    <span>Re-verify</span>
                </button>
                <button onclick="clearProfile()" class="py-2.5 px-3 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-xs rounded-xl border border-slate-300 transition-colors flex items-center justify-center gap-2">
                    <svg class="w-4 h-4 text-slate-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                    <span>Reset</span>
                </button>
            </div>
        </div>

        <!-- SECTION B: Minimal Upload Profile State -->
        <div id="formSection" class="hidden mt-5 space-y-4">
            <div id="cancelFormContainer">
                <button id="cancelFormBtn" onclick="cancelForm()" class="hidden py-1.5 px-3 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-xs rounded-xl border border-slate-300 transition-colors inline-flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-slate-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    <span>Back to Profile</span>
                </button>
            </div>

            <div class="flex items-center justify-between gap-3">
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-slate-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                    </svg>
                    <span>Upload Browser Profile</span>
                </h2>
            </div>

            <!-- Clickable Cloud Upload Zone -->
            <label id="uploadDropZone" for="zipFileInput" class="group border-2 border-dashed border-slate-200 hover:border-slate-400 bg-slate-50/70 hover:bg-slate-100/70 rounded-2xl p-8 text-center cursor-pointer transition-all flex flex-col items-center justify-center">
                <div class="w-14 h-14 rounded-2xl bg-white border border-slate-200 group-hover:border-slate-300 flex items-center justify-center text-slate-500 group-hover:text-slate-900 transition-all mb-2">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                </div>
                <span id="uploadStatusText" class="text-xs font-medium text-slate-400 group-hover:text-slate-600 transition-colors">Click or drop profile zip to upload</span>
                <input type="file" id="zipFileInput" accept=".zip" onchange="autoUploadFile()" class="hidden">
            </label>

            <!-- Upload Progress Container (Shown during upload) -->
            <div id="uploadProgressContainer" class="hidden border border-slate-200 bg-slate-50/80 rounded-2xl p-5 space-y-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2.5 min-w-0">
                        <svg class="w-5 h-5 text-blue-600 animate-spin shrink-0" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span id="uploadProgressFileName" class="text-xs font-semibold text-slate-800 truncate">Uploading profile...</span>
                    </div>
                    <span id="uploadProgressPercent" class="text-xs font-mono font-bold text-blue-600 shrink-0">0%</span>
                </div>

                <!-- Progress Bar -->
                <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                    <div id="uploadProgressBar" class="bg-blue-600 h-2 rounded-full transition-all duration-150 ease-out" style="width: 0%"></div>
                </div>

                <p id="uploadProgressSubtext" class="text-[11px] text-slate-500 font-medium text-center truncate">Uploading zip payload to VPS...</p>
            </div>
        </div>

        <!-- Log Console -->
        <div id="logBox" class="hidden mt-4 p-3 bg-slate-900 text-emerald-400 font-mono text-xs rounded-xl max-h-32 overflow-y-auto border border-slate-800 space-y-1"></div>

    </div>

    <script>
        let isAuthenticated = false;

        function showLog(msg, type = 'info') {
            const box = document.getElementById('logBox');
            box.classList.remove('hidden');
            const colorClass = type === 'error' ? 'text-rose-400' : type === 'success' ? 'text-emerald-400' : 'text-blue-300';
            box.innerHTML += `<div class="${colorClass}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function toggleForm() {
            const form = document.getElementById('formSection');
            const connectedState = document.getElementById('connectedState');
            const cancelBtn = document.getElementById('cancelFormBtn');

            form.classList.remove('hidden');
            connectedState.classList.add('hidden');
            if (isAuthenticated) {
                cancelBtn.classList.remove('hidden');
            }
        }

        function cancelForm() {
            if (isAuthenticated) {
                document.getElementById('formSection').classList.add('hidden');
                document.getElementById('connectedState').classList.remove('hidden');
            }
        }

        async function checkStatus() {
            const loader = document.getElementById('skeletonLoader');
            const connectedState = document.getElementById('connectedState');
            const formSection = document.getElementById('formSection');
            const badge = document.getElementById('statusBadge');
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            loader.classList.remove('hidden');
            connectedState.classList.add('hidden');
            formSection.classList.add('hidden');
            badge.classList.add('hidden');

            try {
                const res = await fetch('/api/session/status');
                const data = await res.json();

                loader.classList.add('hidden');
                badge.classList.remove('hidden');

                if (data.authenticated) {
                    isAuthenticated = true;
                    dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
                    badge.className = 'self-start sm:self-center inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 border border-emerald-200 text-emerald-800 shrink-0';
                    text.innerText = 'Connected & Authenticated';

                    if (data.user) {
                        document.getElementById('userName').innerText = data.user.name || 'Google Account Connected';
                        document.getElementById('userEmail').innerText = data.user.email ? data.user.email : '';
                        if (data.user.avatar) {
                            document.getElementById('userAvatarImg').src = data.user.avatar;
                            document.getElementById('userAvatarImg').classList.remove('hidden');
                            document.getElementById('userInitial').classList.add('hidden');
                        } else {
                            document.getElementById('userInitial').innerText = (data.user.name || 'G').charAt(0).toUpperCase();
                            document.getElementById('userAvatarImg').classList.add('hidden');
                            document.getElementById('userInitial').classList.remove('hidden');
                        }
                    } else {
                        document.getElementById('userName').innerText = 'Google Account Connected';
                        document.getElementById('userEmail').innerText = '';
                        document.getElementById('userInitial').innerText = '✓';
                        document.getElementById('userAvatarImg').classList.add('hidden');
                        document.getElementById('userInitial').classList.remove('hidden');
                    }

                    document.getElementById('connectedDetails').innerText = `Google FX Flow session active (${data.cookieCount} cookies stored).`;
                    connectedState.classList.remove('hidden');
                    formSection.classList.add('hidden');
                    showLog(`✅ Session Active: Authenticated with Google FX Flow! (${data.cookieCount} cookies stored)`, 'success');
                } else {
                    isAuthenticated = false;
                    dot.className = 'w-2 h-2 rounded-full bg-rose-500';
                    badge.className = 'self-start sm:self-center inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-rose-50 border border-rose-200 text-rose-800 shrink-0';
                    text.innerText = 'Not Authenticated';

                    connectedState.classList.add('hidden');
                    formSection.classList.remove('hidden');
                    showLog(`⚠️ Session Inactive: ${data.message}`, 'error');
                }
            } catch (err) {
                loader.classList.add('hidden');
                badge.classList.remove('hidden');
                isAuthenticated = false;

                dot.className = 'w-2 h-2 rounded-full bg-rose-500';
                badge.className = 'self-start sm:self-center inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-rose-50 border border-rose-200 text-rose-800 shrink-0';
                text.innerText = 'Connection Error';

                connectedState.classList.add('hidden');
                formSection.classList.remove('hidden');
                showLog(`❌ Network error: ${err.message}`, 'error');
            }
        }

        function autoUploadFile() {
            const fileInput = document.getElementById('zipFileInput');
            if (!fileInput.files || fileInput.files.length === 0) return;

            const file = fileInput.files[0];
            const dropZone = document.getElementById('uploadDropZone');
            const progressContainer = document.getElementById('uploadProgressContainer');
            const fileNameElem = document.getElementById('uploadProgressFileName');
            const percentElem = document.getElementById('uploadProgressPercent');
            const progressBar = document.getElementById('uploadProgressBar');
            const subtextElem = document.getElementById('uploadProgressSubtext');

            // Show Progress card, hide drop zone
            dropZone.classList.add('hidden');
            progressContainer.classList.remove('hidden');
            fileNameElem.innerText = `Uploading ${file.name}`;
            percentElem.innerText = '0%';
            progressBar.style.width = '0%';
            subtextElem.innerText = `Uploading ${(file.size / (1024 * 1024)).toFixed(1)} MB zip payload to VPS...`;

            showLog(`🚀 Uploading ${file.name} (${(file.size / (1024 * 1024)).toFixed(2)} MB) to VPS...`);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/session/upload-zip', true);
            xhr.setRequestHeader('Content-Type', 'application/zip');

            xhr.upload.onprogress = function (e) {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = percent + '%';
                    percentElem.innerText = percent + '%';

                    if (percent >= 100) {
                        subtextElem.innerText = 'Extracting zip & verifying Google session on VPS...';
                    } else {
                        const loadedMb = (e.loaded / (1024 * 1024)).toFixed(1);
                        const totalMb = (e.total / (1024 * 1024)).toFixed(1);
                        subtextElem.innerText = `Uploaded ${loadedMb} MB / ${totalMb} MB (${percent}%)`;
                    }
                }
            };

            xhr.onload = async function () {
                dropZone.classList.remove('hidden');
                progressContainer.classList.add('hidden');
                fileInput.value = '';

                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        const data = JSON.parse(xhr.responseText);
                        if (data.success) {
                            showLog(`✅ ${data.message}`, 'success');
                            await checkStatus();
                        } else {
                            showLog(`❌ Failed to save session: ${data.error}`, 'error');
                        }
                    } catch (e) {
                        showLog(`❌ Response parse error: ${e.message}`, 'error');
                    }
                } else {
                    showLog(`❌ HTTP Error ${xhr.status}: ${xhr.statusText || 'Upload Failed'}`, 'error');
                }
            };

            xhr.onerror = function () {
                dropZone.classList.remove('hidden');
                progressContainer.classList.add('hidden');
                fileInput.value = '';
                showLog('❌ Network error during file upload.', 'error');
            };

            xhr.send(file);
        }

        async function clearProfile() {
            if (!confirm('Are you sure you want to clear the browser profile on VPS?')) return;
            try {
                const res = await fetch('/api/session/clear', { method: 'POST' });
                const data = await res.json();
                showLog(data.message, 'success');
                await checkStatus();
            } catch (err) {
                showLog(`❌ Error: ${err.message}`, 'error');
            }
        }

        // Run status check on page load
        checkStatus();
    </script>
</body>
</html>
